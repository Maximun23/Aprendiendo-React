<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Css/resultados.css">
</head>
<body>
    <div class="result-container">
        <!-- Basic Flavor Section -->
        <div class="result-section">
          <h2 class="section-title">Basic Flavor</h2>
          <div class="result-table">
            <!-- Umami -->
            <div class="result-row">
              <div class="result-key">Umami</div>
              <div class="result-bar">
                <div class="tooltip">Your number is: 5</div>
                <div class="filled-bar" style="width: 80%;" data-number="5"></div>
              </div>
            </div>
            <!-- Sourness -->
            <div class="result-row">
              <div class="result-key">Sourness</div>
              <div class="result-bar">
                <div class="tooltip">Your number is: 3</div>
                <div class="filled-bar" style="width: 50%;" data-number="3"></div>
              </div>
            </div>
            <!-- Saltiness -->
            <div class="result-row">
              <div class="result-key">Saltiness</div>
              <div class="result-bar">
                <div class="tooltip">Your number is: 1</div>
                <div class="filled-bar" style="width: 20%;" data-number="1"></div>
              </div>
            </div>
            <!-- Sweetness -->
            <div class="result-row">
              <div class="result-key">Sweetness</div>
              <div class="result-bar">
                <div class="tooltip">Your number is: 7</div>
                <div class="filled-bar" style="width: 70%;" data-number="7"></div>
              </div>
            </div>
            <!-- Bitterness -->
            <div class="result-row">
              <div class="result-key">Bitterness</div>
              <div class="result-bar">
                <div class="tooltip">Your number is: 4</div>
                <div class="filled-bar" style="width: 40%;" data-number="4"></div>
              </div>
            </div>
            <!-- Richness -->
            <div class="result-row">
              <div class="result-key">Richness</div>
              <div class="result-bar">
                <div class="tooltip">Your number is: 8</div>
                <div class="filled-bar" style="width: 80%;" data-number="8"></div>
              </div>
            </div>
          </div>
        </div>
    </div>

    <script src="resultados.js"></script> <!-- Archivo JS para manejar el hover -->
</body>
</html>
